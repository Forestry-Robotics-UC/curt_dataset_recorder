networks:
  ros2-net:
  link-local-net:
    driver: macvlan
    driver_opts:
      parent: enp86s0  # Specify your parent network interface (e.g., enp86s0)
    ipam:
      config:
        - subnet: 169.254.0.0/16
          gateway: 169.254.0.1

x-realsense-common: &realsense-common
  image: docker-realsense:latest
  build:
    context: .
    dockerfile: realsense/realsense.Dockerfile
  privileged: true
  networks:
    - ros2-net
  environment:
    # file:/// URL for the calibrated replacement of /camera/color/camera_info
    REALSENSE_COLOR_CAMERA_INFO_URL: ""
    # Optional file:/// URL for the replacement of /camera/aligned_depth_to_color/camera_info
    REALSENSE_ALIGNED_DEPTH_TO_COLOR_CAMERA_INFO_URL: ""
    # Compression sidecar mode: none, compressed (PNG), or ffmpeg
    REALSENSE_COMPRESS_MODE: "none"
    # Comma-separated raw image topics to republish through the selected transport
    REALSENSE_COMPRESS_TOPICS: "/camera/color/image_raw"
    # PNG compression effort for the compressed_image_transport path
    COMPRESS_PNG_LEVEL: "1"
    # ffmpeg encoder used by the ffmpeg_image_transport path
    COMPRESS_FFMPEG_ENCODER: "libx264"
    # Near-lossless ffmpeg settings; prefer CRF 0 for minimum loss
    COMPRESS_FFMPEG_ENCODER_AV_OPTIONS: "preset:ultrafast,tune:zerolatency,crf:0"
    # ffmpeg target bitrate in bits/s
    COMPRESS_FFMPEG_BIT_RATE: "20000000"
    # ffmpeg GOP size in frames
    COMPRESS_FFMPEG_GOP_SIZE: "10"
    # ffmpeg maximum quantizer; lower is less lossy
    COMPRESS_FFMPEG_QMAX: "1"
  volumes:
    - /dev/:/dev/
    - ../ros2_ws/realsense-build:/root/ros2_ws/build
    - ../shared_folder/:/root/shared_folder/
    - ../sensor_configs/realsense/:/root/sensor_configs/realsense/:rw
    - ../sensor_configs/realsense/rs_launch.py:/root/ros2_ws/src/realsense-ros/realsense2_camera/launch/rs_launch.py:rw
    - ../ros2_ws/realsense_camera_info_override:/root/ros2_ws/src/realsense_camera_info_override:rw
  command: /root/shared_folder/realsense-launch.sh

x-mapir-common: &mapir-common
  image: docker-mapir:latest
  build:
    context: .
    dockerfile: mapir/mapir.Dockerfile
  privileged: true
  networks:
    - ros2-net
  environment:
    # Compression sidecar mode: none, compressed (PNG), or ffmpeg
    MAPIR_COMPRESS_MODE: "none"
    # Comma-separated raw image topics to republish through the selected transport
    MAPIR_COMPRESS_TOPICS: "/mapir/image_raw"
    # PNG compression effort for the compressed_image_transport path
    COMPRESS_PNG_LEVEL: "1"
    # ffmpeg encoder used by the ffmpeg_image_transport path
    COMPRESS_FFMPEG_ENCODER: "libx264"
    # Near-lossless ffmpeg settings; prefer CRF 0 for minimum loss
    COMPRESS_FFMPEG_ENCODER_AV_OPTIONS: "preset:ultrafast,tune:zerolatency,crf:0"
    # ffmpeg target bitrate in bits/s
    COMPRESS_FFMPEG_BIT_RATE: "20000000"
    # ffmpeg GOP size in frames
    COMPRESS_FFMPEG_GOP_SIZE: "10"
    # ffmpeg maximum quantizer; lower is less lossy
    COMPRESS_FFMPEG_QMAX: "1"
  volumes:
    - /dev/:/dev/
    - ../ros2_ws/mapir-build:/root/ros2_ws/build
    - ../shared_folder/:/root/shared_folder/
    - ../sensor_configs/mapir/:/root/sensor_configs/mapir/:rw
    - /home/curt/Documents/Duda/mapir-camera-ros2:/root/ros2_ws/src/mapir-camera-ros2:ro
  command: /root/shared_folder/mapir-launch.sh

services:
  openzen:
    image: docker-openzen:latest
    build:
     context: .
     dockerfile: openzen/openzen.Dockerfile
    container_name: openzen
    privileged: true
    devices:
      - "/dev/ttyUSB0:/dev/ttyUSB0"
    networks:
      - ros2-net
    volumes:
      - /dev/:/dev/
      - ../ros2_ws/openzen-build:/root/ros2_ws/build
      - ../shared_folder/:/root/shared_folder/
      - ../sensor_configs/openzen/OpenZenNode.cpp:/root/ros2_ws/src/openzenros2/src/OpenZenNode.cpp
      - ../sensor_configs/openzen/openzen_lpms.launch.py:/root/ros2_ws/src/openzenros2/launch/openzen_lpms.launch.py
    command: /root/shared_folder/openzen-launch.sh

  rm3100:
    build:
      context: .
      dockerfile: rm3100/rm3100.Dockerfile
    container_name: rm3100
    privileged: true
    networks:
      - ros2-net
    volumes:
      - /dev/:/dev/
      - ../ros2_ws/rm3100-build:/root/ros2_ws/build
      - ../shared_folder/:/root/shared_folder/
      - ../sensor_configs/rm3100/params.yaml:/root/ros2_ws/src/go1_magnetometer_rm3100/config/params.yaml:rw
      - ../sensor_configs/rm3100/rm3100_driver.launch.py:/root/ros2_ws/src/go1_magnetometer_rm3100/launch/rm3100_driver.launch.py:rw
      - ../sensor_configs/rm3100/rm3100_driver.py:/root/ros2_ws/src/go1_magnetometer_rm3100/src/rm3100_driver.py:rw
      - ../ros2_ws/imu_mag_fusion:/root/ros2_ws/src/imu_mag_fusion
    command: /root/shared_folder/rm3100-launch.sh

  emlid:
    build:
      context: .
      dockerfile: emlid/emlid.Dockerfile
    container_name: emlid
    privileged: true
    networks:
      - ros2-net
    volumes:
      - /dev/:/dev/
      - ../ros2_ws/emlid-build:/root/ros2_ws/build
      - ../shared_folder/:/root/shared_folder/
      - ../sensor_configs/emlid/nmea_serial_driver.py:/root/ros2_ws/src/nmea_navsat_driver/src/libnmea_navsat_driver/nodes/nmea_serial_driver.py:rw
      - ../sensor_configs/emlid/nmea_serial_driver.yaml:/root/ros2_ws/src/nmea_navsat_driver/config/nmea_serial_driver.yaml:rw
    command: /root/shared_folder/emlid-launch.sh

  realsense:
    <<: *realsense-common
    container_name: realsense
  realsense_png:
    <<: *realsense-common
    container_name: realsense-png
    profiles: ["realsense-png"]
    environment:
      REALSENSE_COLOR_CAMERA_INFO_URL: ""
      REALSENSE_ALIGNED_DEPTH_TO_COLOR_CAMERA_INFO_URL: ""
      REALSENSE_COMPRESS_MODE: "compressed"
      REALSENSE_COMPRESS_TOPICS: "/camera/color/image_raw"
      COMPRESS_PNG_LEVEL: "1"
      COMPRESS_FFMPEG_ENCODER: "libx264"
      COMPRESS_FFMPEG_ENCODER_AV_OPTIONS: "preset:ultrafast,tune:zerolatency,crf:0"
      COMPRESS_FFMPEG_BIT_RATE: "20000000"
      COMPRESS_FFMPEG_GOP_SIZE: "10"
      COMPRESS_FFMPEG_QMAX: "1"
  realsense_ffmpeg:
    <<: *realsense-common
    container_name: realsense-ffmpeg
    profiles: ["realsense-ffmpeg"]
    environment:
      REALSENSE_COLOR_CAMERA_INFO_URL: ""
      REALSENSE_ALIGNED_DEPTH_TO_COLOR_CAMERA_INFO_URL: ""
      REALSENSE_COMPRESS_MODE: "ffmpeg"
      REALSENSE_COMPRESS_TOPICS: "/camera/color/image_raw"
      COMPRESS_PNG_LEVEL: "1"
      COMPRESS_FFMPEG_ENCODER: "libx264"
      COMPRESS_FFMPEG_ENCODER_AV_OPTIONS: "preset:ultrafast,tune:zerolatency,crf:0"
      COMPRESS_FFMPEG_BIT_RATE: "20000000"
      COMPRESS_FFMPEG_GOP_SIZE: "10"
      COMPRESS_FFMPEG_QMAX: "1"

  ouster:
    image: docker-ouster:latest
    build:
      context: .
      dockerfile: ouster/os.Dockerfile
    container_name: ouster
    privileged: true
    networks:
      - ros2-net
      - link-local-net
    ports:
      - "7502:7502/udp"
      - "7503:7503/udp"
    volumes:
      - ../ros2_ws/ouster-build:/root/ros2_ws/build
      - ../shared_folder/:/root/shared_folder/
      - ../sensor_configs/ouster/driver_params.yaml:/root/ros2_ws/src/ouster-ros/ouster-ros/config/driver_params.yaml:rw
    command: /root/shared_folder/ouster-launch.sh

  mapir:
    <<: *mapir-common
    container_name: mapir
  mapir_png:
    <<: *mapir-common
    container_name: mapir-png
    profiles: ["mapir-png"]
    environment:
      MAPIR_COMPRESS_MODE: "compressed"
      MAPIR_COMPRESS_TOPICS: "/mapir/image_raw"
      COMPRESS_PNG_LEVEL: "1"
      COMPRESS_FFMPEG_ENCODER: "libx264"
      COMPRESS_FFMPEG_ENCODER_AV_OPTIONS: "preset:ultrafast,tune:zerolatency,crf:0"
      COMPRESS_FFMPEG_BIT_RATE: "20000000"
      COMPRESS_FFMPEG_GOP_SIZE: "10"
      COMPRESS_FFMPEG_QMAX: "1"
  mapir_ffmpeg:
    <<: *mapir-common
    container_name: mapir-ffmpeg
    profiles: ["mapir-ffmpeg"]
    environment:
      MAPIR_COMPRESS_MODE: "ffmpeg"
      MAPIR_COMPRESS_TOPICS: "/mapir/image_raw"
      COMPRESS_PNG_LEVEL: "1"
      COMPRESS_FFMPEG_ENCODER: "libx264"
      COMPRESS_FFMPEG_ENCODER_AV_OPTIONS: "preset:ultrafast,tune:zerolatency,crf:0"
      COMPRESS_FFMPEG_BIT_RATE: "20000000"
      COMPRESS_FFMPEG_GOP_SIZE: "10"
      COMPRESS_FFMPEG_QMAX: "1"

  curt:
    image: docker-curt:latest
    build:
      context: .
      dockerfile: curt/curt.Dockerfile
    container_name: curt
    privileged: true
    networks:
      - ros2-net
    volumes:
      - ../ros2_ws/curt-build:/root/ros2_ws/build
      - ../ros2_ws/curt_description:/root/ros2_ws/src/curt_description
      - ../shared_folder/:/root/shared_folder/
    command: /root/shared_folder/curt-launch.sh

  recorder:
    image: docker-recorder:latest
    build:
      context: .
      dockerfile: recorder/recorder.Dockerfile
    container_name: recorder
    privileged: true
    networks:
      - ros2-net
    volumes:
      - /dev/:/dev/
      - ../../rosbags:/root/rosbags/
      - ../ros2_ws/recorder-build:/root/ros2_ws/build
      - ../shared_folder/:/root/shared_folder/
    command: /root/shared_folder/recorder-launch.sh

  ## Extra Sensors

  evk4:
    image: docker-evk4:latest
    build:
      context: .
      dockerfile: evk4/evk4.Dockerfile
    container_name: evk4
    privileged: true
    networks:
      - ros2-net
    volumes:
      - ../shared_folder/:/root/shared_folder/
    command:  /root/shared_folder/evk4-launch.sh

