
services:
  openzen:
    image: docker-openzen:latest
    build:
     context: .
     dockerfile: openzen/openzen.Dockerfile
    container_name: openzen
    privileged: true
    devices:
      - "/dev/ttyUSB0:/dev/ttyUSB0"
    network_mode: host
    volumes:
      - /dev/:/dev/
      - ../ros2_ws/build/openzen-build:/root/ros2_ws/build
      - ../shared_folder/:/root/shared_folder/
      - ../sensor_configs/openzen/OpenZenNode.cpp:/root/ros2_ws/src/openzenros2/src/OpenZenNode.cpp
      - ../sensor_configs/openzen/openzen_lpms.launch.py:/root/ros2_ws/src/openzenros2/launch/openzen_lpms.launch.py
    environment:
      - ROS_DOMAIN_ID=37
    command: /root/shared_folder/openzen-launch.sh
    cpuset: "10-13"

  rm3100:
    build:
      context: .
      dockerfile: rm3100/rm3100.Dockerfile
    container_name: rm3100
    privileged: true
    network_mode: host
    volumes:
      - /dev/:/dev/
      - ../ros2_ws/build/rm3100-build:/root/ros2_ws/build
      - ../shared_folder/:/root/shared_folder/
      - ../sensor_configs/rm3100/params.yaml:/root/ros2_ws/src/go1_magnetometer_rm3100/config/params.yaml:rw
      - ../sensor_configs/rm3100/rm3100_driver.launch.py:/root/ros2_ws/src/go1_magnetometer_rm3100/launch/rm3100_driver.launch.py:rw
      - ../sensor_configs/rm3100/rm3100_driver.py:/root/ros2_ws/src/go1_magnetometer_rm3100/src/rm3100_driver.py:rw
      - ../ros2_ws/src/imu_mag_fusion:/root/ros2_ws/src/imu_mag_fusion
    environment:
      - ROS_DOMAIN_ID=37
    command: /root/shared_folder/rm3100-launch.sh
    cpuset: "14-15"

  emlid:
    build:
      context: .
      dockerfile: emlid/emlid.Dockerfile
    container_name: emlid
    privileged: true
    network_mode: host
    volumes:
      - /dev/:/dev/
      - ../ros2_ws/build/emlid-build:/root/ros2_ws/build
      - ../shared_folder/:/root/shared_folder/
      - ../sensor_configs/emlid/nmea_serial_driver.py:/root/ros2_ws/src/nmea_navsat_driver/src/libnmea_navsat_driver/nodes/nmea_serial_driver.py:rw
      - ../sensor_configs/emlid/driver.py:/root/ros2_ws/src/nmea_navsat_driver/src/libnmea_navsat_driver/driver.py:rw
      - ../sensor_configs/emlid/nmea_serial_driver.yaml:/root/ros2_ws/src/nmea_navsat_driver/config/nmea_serial_driver.yaml:rw
    environment:
      - ROS_DOMAIN_ID=37
    command: /root/shared_folder/emlid-launch.sh
    cpuset: "14-15"

  realsense:
    image: docker-realsense:latest
    build:
      context: .
      dockerfile: realsense/realsense.Dockerfile
    container_name: realsense
    privileged: true
    network_mode: host
    environment:
      REALSENSE_COLOR_CAMERA_INFO_URL: ""
      REALSENSE_ALIGNED_DEPTH_TO_COLOR_CAMERA_INFO_URL: ""
      REALSENSE_COMPRESS_MODE: "none"
      REALSENSE_COMPRESS_TOPICS: "/camera/color/image_raw"
      COMPRESS_PNG_LEVEL: "1"
      COMPRESS_FFMPEG_ENCODER: "libx264rgb"
      COMPRESS_FFMPEG_ENCODER_AV_OPTIONS: "preset:ultrafast,crf:0"
      COMPRESS_FFMPEG_BIT_RATE: "20000000"
      COMPRESS_FFMPEG_GOP_SIZE: "10"
      COMPRESS_FFMPEG_QMAX: "1"
      ROS_DOMAIN_ID: 37
    volumes:
      - /dev/:/dev/
      - ../ros2_ws/build/realsense-build:/root/ros2_ws/build
      - ../shared_folder/:/root/shared_folder/
      - ../sensor_configs/realsense/:/root/sensor_configs/realsense/:rw
      - ../sensor_configs/realsense/rs_launch.py:/root/ros2_ws/src/realsense-ros/realsense2_camera/launch/rs_launch.py:rw
      - ../ros2_ws/src/realsense_camera_info_override:/root/ros2_ws/src/realsense_camera_info_override:rw
    command: /root/shared_folder/realsense-launch.sh
    cpuset: "10-13"

  ouster:
    image: docker-ouster:latest
    build:
      context: .
      dockerfile: ouster/os.Dockerfile
    container_name: ouster
    privileged: true
    network_mode: host
    # ports:
    #   - "7502:7502/udp"
    #   - "7503:7503/udp"
    volumes:
      - ../ros2_ws/build/ouster-build:/root/ros2_ws/build
      - ../shared_folder/:/root/shared_folder/
      - ../sensor_configs/ouster/driver_params.yaml:/root/ros2_ws/src/ouster-ros/ouster-ros/config/driver_params.yaml:rw
    environment:
      - ROS_DOMAIN_ID=37
    command: /root/shared_folder/ouster-launch.sh
    cpuset: "10-13"

  mapir_ffmpeg:
    image: docker-mapir:latest
    build:
      context: .
      dockerfile: mapir/mapir.Dockerfile
    container_name: mapir-ffmpeg
    #profiles: ["mapir-ffmpeg"]
    privileged: true
    network_mode: host
    environment:
      MAPIR_COMPRESS_MODE: "ffmpeg"
      MAPIR_COMPRESS_TOPICS: "/mapir/image_raw"
      COMPRESS_PNG_LEVEL: "1"
      COMPRESS_FFMPEG_ENCODER: "libx264rgb"
      COMPRESS_FFMPEG_ENCODER_AV_OPTIONS: "preset:ultrafast,crf:0"
      COMPRESS_FFMPEG_BIT_RATE: "20000000"
      COMPRESS_FFMPEG_GOP_SIZE: "10"
      COMPRESS_FFMPEG_QMAX: "1"
      ROS_DOMAIN_ID: 37
    volumes:
      - /dev/:/dev/
      - ../ros2_ws/build/mapir-build:/root/ros2_ws/build
      - ../shared_folder/:/root/shared_folder/
      - ../sensor_configs/mapir/:/root/sensor_configs/mapir/:rw
      - ../sensor_configs/mapir/mapir_camera_params.yaml:/root/ros2_ws/src/mapir-camera-ros2/config/mapir_camera_params.yaml:rw
      - ../sensor_configs/mapir/mapir_camera.launch.py:/root/ros2_ws/src/mapir-camera-ros2/launch/mapir_camera.launch.py:rw
    command: /root/shared_folder/mapir-launch.sh
    cpuset: "10-13"

  curt:
    image: docker-curt:latest
    build:
      context: .
      dockerfile: curt/curt.Dockerfile
    container_name: curt
    privileged: true
    network_mode: host
    volumes:
      - ../ros2_ws/build/curt-build:/root/ros2_ws/build
      - ../ros2_ws/src/curt_description:/root/ros2_ws/src/curt_description
      - ../shared_folder/:/root/shared_folder/
    environment:
      - ROS_DOMAIN_ID=37
    command: /root/shared_folder/curt-launch.sh
    cpuset: "14-15"

  recorder:
    image: docker-recorder:latest
    build:
      context: .
      dockerfile: recorder/recorder.Dockerfile
      args:
        USERNAME: rosuser
        USER_UID: ${UID:-1000}
        USER_GID: ${GID:-1000}
    container_name: recorder
    user: ${USER_UID}:${USER_GID}  # Run as the specified user
    privileged: true
    network_mode: host
    volumes:
      - /dev/:/dev/
      - ../../rosbags:/home/rosuser/rosbags/
      - ../ros2_ws/build/recorder-build:/home/rosuser/ros2_ws/build
      - ../shared_folder/:/home/rosuser/shared_folder/
    environment:
      - ROS_DOMAIN_ID=37
      - BAGFILE_NAME=""
      - TOPICS=""
      - HEADLESS=0
    command: /home/rosuser/shared_folder/recorder-launch.sh
    cpuset: "12-15"

  ## Extra Sensors

  evk4:
    image: docker-evk4:latest
    build:
      context: .
      dockerfile: evk4/evk4.Dockerfile
    container_name: evk4
    privileged: true
    network_mode: host
    volumes:
      - ../shared_folder/:/root/shared_folder/
    environment:
      - ROS_DOMAIN_ID=37
    command:  /root/shared_folder/evk4-launch.sh
    cpuset: "10-13"

  foxglove:
    build:
      context: .
      dockerfile: foxglove/foxglove.Dockerfile
    container_name: foxglove
    privileged: true
    # ports:
    #   - "9092:9092"
    network_mode: host
    volumes:
      - /dev/:/dev/
      - ../../rosbags/:/root/rosbags/
      - ../ros2_ws/build/foxglove-build:/root/ros2_ws/build
      - ../shared_folder/:/root/shared_folder/
      - ../ros2_ws/src/curt_description:/root/ros2_ws/src/curt_description
      - /tmp/.X11-unix:/tmp/.X11-unix
    environment:
      - DISPLAY=$DISPLAY
      - ROS_DOMAIN_ID=37
    command: /root/shared_folder/foxglove-launch.sh
    cpuset: "9"

### NAVIGATION PIPELINE ###
  traversability_ros2:
    build:
     context: .
     dockerfile: traversability_mapping/traversability_mapping_ros2.Dockerfile
    container_name: trav_ros2
    privileged: true
    network_mode: host
    volumes:
      - /dev/:/dev/
      - ../ros2_ws/build/trav_ros2-build:/root/ros2_ws/build
      - ../shared_folder/:/root/shared_folder/
      - ../ros2_ws/src/traversability_mapping_ros2:/root/ros2_ws/src/traversability_mapping_ros2
    environment:
      - ROS_DOMAIN_ID=37
    command: /root/shared_folder/trav_ros2-launch.sh
    cpuset: "8"

  glim:
    build:
     context: .
     dockerfile: glim/glim.Dockerfile
    container_name: glim
    privileged: true
    network_mode: host
    volumes:
      - /dev/:/dev/
      - ../../rosbags/:/root/rosbags/
      - ../ros2_ws/build/glim-build:/root/ros2_ws/build
      - ../shared_folder/:/root/shared_folder/
      - ../sensor_configs/glim/config:/root/ros2_ws/src/glim/config
    environment:
      - ROS_DOMAIN_ID=37
    command: /root/shared_folder/glim-launch.sh
    cpuset: "0-5"

  nav2:
    build:
      context: .
      dockerfile: nav2/nav2.Dockerfile
    container_name: nav2
    network_mode: host
    volumes:
      - ../ros2_ws/build/nav2-build:/root/ros2_ws/build
      - ../shared_folder/:/root/shared_folder/
      - ../sensor_configs/nav2:/root/nav2
      - ../sensor_configs/nav2/navigation_launch.py:/opt/ros/kilted/share/nav2_bringup/launch/navigation_launch.py:rw
      - ../sensor_configs/nav2/bringup_launch.py:/opt/ros/kilted/share/nav2_bringup/launch/bringup_launch.py:rw
    environment:
      - ROS_DOMAIN_ID=37
    command: /root/shared_folder/nav2-launch.sh
    cpuset: "6"
