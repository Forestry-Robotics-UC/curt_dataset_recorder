  foxglove:
    build:
      context: .
      dockerfile: foxglove/foxglove.Dockerfile
    container_name: foxglove
    privileged: true
    ports:
      - "9092:9092"
    networks:
      - ros2-net
    volumes:
      - /dev/:/dev/
